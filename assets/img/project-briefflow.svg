<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="BriefFlow illustration">
  <defs>
    <linearGradient id="bf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.5" stop-color="#16307a"/>
      <stop offset="1" stop-color="#0e6bb0"/>
    </linearGradient>
    <linearGradient id="bf-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#38b0f0"/>
    </linearGradient>
    <filter id="bf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bf-bg)"/>
  <circle cx="1060" cy="80" r="260" fill="#38b0f0" opacity=".1"/>
  <circle cx="90" cy="700" r="300" fill="#4f7bff" opacity=".12"/>
  <g opacity=".16">
    <path d="M0 125h1200M0 250h1200M0 375h1200M0 500h1200M0 625h1200" stroke="#fff"/>
    <path d="M150 0v750M300 0v750M450 0v750M600 0v750M750 0v750M900 0v750M1050 0v750" stroke="#fff"/>
  </g>
  <g filter="url(#bf-shadow)">
    <rect x="100" y="120" width="1000" height="510" rx="36" fill="#0f1a30" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="140" y="160" width="920" height="66" rx="18" fill="#ffffff" fill-opacity=".07"/>
    <circle cx="180" cy="193" r="9" fill="#f87171"/>
    <circle cx="210" cy="193" r="9" fill="#fbbf24"/>
    <circle cx="240" cy="193" r="9" fill="#34d399"/>
    <rect x="720" y="176" width="300" height="34" rx="17" fill="#ffffff" fill-opacity=".08"/>

    <!-- flow columns / pipeline of briefs -->
    <g>
      <!-- connectors -->
      <path d="M330 400 H470" stroke="url(#bf-accent)" stroke-width="6" fill="none" opacity=".9"/>
      <path d="M630 400 H770" stroke="url(#bf-accent)" stroke-width="6" fill="none" opacity=".9"/>
      <circle cx="470" cy="400" r="8" fill="#38b0f0"/>
      <circle cx="770" cy="400" r="8" fill="#38b0f0"/>

      <!-- node 1: Brief -->
      <rect x="150" y="300" width="180" height="200" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="176" y="330" width="128" height="16" rx="8" fill="url(#bf-accent)"/>
      <rect x="176" y="362" width="100" height="10" rx="5" fill="#ffffff" opacity=".22"/>
      <rect x="176" y="384" width="118" height="10" rx="5" fill="#ffffff" opacity=".16"/>
      <rect x="176" y="430" width="128" height="42" rx="12" fill="#4f7bff" opacity=".85"/>

      <!-- node 2: Flow -->
      <rect x="470" y="270" width="160" height="260" rx="24" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="494" y="300" width="112" height="52" rx="12" fill="#ffffff" fill-opacity=".1"/>
      <rect x="494" y="366" width="112" height="52" rx="12" fill="#ffffff" fill-opacity=".08"/>
      <rect x="494" y="432" width="112" height="52" rx="12" fill="url(#bf-accent)" opacity=".85"/>

      <!-- node 3: Deliver -->
      <rect x="770" y="300" width="280" height="200" rx="24" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="800" y="330" width="150" height="16" rx="8" fill="url(#bf-accent)"/>
      <rect x="800" y="362" width="220" height="10" rx="5" fill="#ffffff" opacity=".2"/>
      <rect x="800" y="384" width="200" height="10" rx="5" fill="#ffffff" opacity=".14"/>
      <rect x="800" y="406" width="210" height="10" rx="5" fill="#ffffff" opacity=".14"/>
      <rect x="800" y="446" width="120" height="38" rx="19" fill="#38b0f0" opacity=".85"/>
    </g>
  </g>
  <text x="120" y="685" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" fill="#fff">BriefFlow</text>
  <text x="120" y="725" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">AI client intake → auto brief, proposal &amp; timeline</text>
</svg>
